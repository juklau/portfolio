<!DOCTYPE html>
<html lang="fr" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact | Klaudia Juhasz</title>

        <!-- CSS de Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
        <script>(function(){var t=localStorage.getItem("portfolio-theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
        
        <link rel="icon" href="favicon.svg" type="image/svg+xml">
        <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" type="image/png">
        <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
        <link rel="stylesheet" href="style.css">
    </head> 
    <body class="overflow-x-hidden bg-dark">
        <header id="header" class="border-bottom border-secondary"></header>

        <main class="bg-dark py-5">
            <div class="container-fluid py-5">
                <h1 class="text-white text-center py-5 my-4">Contact</h1> 
            </div>

            <div class="container text-center text-white " id="remplir">
                <p class="fst-italic">Veuillez remplir ce formulaire pour me contacter</p>
            </div>

            <section class="container d-flex justify-content-center align-items-center py-3">
                <div class="col-lg-6 col-md-8">
                    <div class="card box-shadow bg-secondary bg-opacity-10 border-0 rounded-1 p-4">
                        <!-- action="https://formspree.io/f/xaneaygb" method="POST" -->
                         <form id="contact-form" class="text-white" novalidate>
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label" for="nom">Nom *</label>
                                    <input class="form-control" type="text" id="nom" name="nom"
                                        autocomplete="family-name" maxlength="50" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label" for="prenom">Prénom *</label>
                                    <input class="form-control" type="text" id="prenom" name="prenom"
                                        autocomplete="given-name" maxlength="50" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label" for="email">Email *</label>
                                    <input class="form-control" type="email" id="email" name="email"
                                        autocomplete="email" maxlength="100" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label" for="sujet">Sujet *</label>
                                    <input class="form-control" type="text" id="sujet" name="sujet"
                                        maxlength="100" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label" for="message">Message *</label>
                                    <textarea class="form-control" id="message" name="message"
                                        rows="8" maxlength="1000" required></textarea>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <!-- Piege anti-spam Formspree : invisible pour les humains, rempli par les robots -->
                                <input type="text" name="_gotcha" class="d-none" tabindex="-1" autocomplete="off" aria-hidden="true">

                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="consentement" name="consentement" required>
                                        <label class="form-check-label" for="consentement">
                                            J'accepte que mes données servent uniquement à me recontacter.
                                        </label>
                                        <div class="invalid-feedback">Vous devez accepter pour envoyer le formulaire.</div>
                                    </div>
                                    <p class="small fst-italic mt-2 mb-0 lien-intern">
                                        Pour en savoir plus, consultez les
                                        <a class="text-white" href="mentions-legales.html">mentions légales</a>.
                                    </p>
                                </div>

                                <p class="small mb-0">* Champs obligatoires</p>

                                <div class="col-12 d-flex justify-content-center pt-2">
                                    <button class="btn btn-outline-secondary border border-2 rounded portfolio-btn" id="submit-btn" type="submit">Envoyer</button>
                                </div>

                                <div class="col-12">
                                    <div id="form-status" role="status"></div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer id="site-footer" class="footer container-fluid text-center text-white bg-dark p-0 pt-5"></footer>

        <!-- script de AOS-->
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

        <!-- scripts -->
        <script src="assets/js/contact.js"></script>
        <script src="assets/js/layout.js"></script>
        <script src="assets/js/portfolio.js"></script>

        <!-- script de Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    </body>
</html>
